    <!-- Service Worker Kill-Switch & Cache Buster -->
    <script>
      (function() {
        var CURRENT_VERSION = 'v0.0.1352';

        // Purga garantida síncrona na entrada (antes do primeiro render do React)
        try {
          var storedVersion = localStorage.getItem('app_version');
          if (storedVersion !== CURRENT_VERSION) {
            // Versão mudou ou primeira inicialização nesta build:
            // 1. Purga todas as chaves de rota, stores persistidos e caches que possam conter "Index" ou estado antigo
            localStorage.removeItem('currentRoute');
            localStorage.removeItem('route-store');
            localStorage.removeItem('vite-plugin-react-router-cache');
            sessionStorage.removeItem('vite-plugin-react-router-cache');

            // 2. Grava o carimbo de versão atualizado
            localStorage.setItem('app_version', CURRENT_VERSION);

            // 3. Se havia versão anterior armazenada, forçar UMA única recarga limpa para garantir descarte de bundles/SW antigos
            var reloadKey = 'app_reload_version_' + CURRENT_VERSION;
            if (storedVersion && !sessionStorage.getItem(reloadKey)) {
              sessionStorage.setItem(reloadKey, '1');
              window.location.reload();
              return;
            }
          }
        } catch (e) {}

        // Inicialização defensiva síncrona de rota para scanners e robôs de auditoria
        try {
          var initialPath = window.location.pathname || '/';
          var cleanPath = initialPath.split('?')[0].split('#')[0].toLowerCase().trim();
          var initialComp = 'Atendimentos';
          if (cleanPath === '' || cleanPath === '/' || cleanPath.indexOf('/atendimentos') === 0) initialComp = 'Atendimentos';
          else if (cleanPath.indexOf('/dashboard') === 0) initialComp = 'Dashboard';
          else if (cleanPath.indexOf('/customers') === 0 || cleanPath.indexOf('/cadences') === 0 || cleanPath.indexOf('/clientes') === 0) initialComp = 'Customers';
          else if (cleanPath.indexOf('/launches') === 0) initialComp = 'Launches';
          else if (cleanPath.indexOf('/posts') === 0) initialComp = 'ScheduledPosts';
          else if (cleanPath.indexOf('/estatisticas') === 0) initialComp = 'Estatisticas';
          else if (cleanPath.indexOf('/anuncios') === 0) initialComp = 'Anuncios';
          else if (cleanPath.indexOf('/faxina-meta') === 0) initialComp = 'FaxinaAtivosMeta';
          else if (cleanPath.indexOf('/email-marketing') === 0) initialComp = 'EmailMarketing';
          else if (cleanPath.indexOf('/settings') === 0) initialComp = 'SettingsAI';
          else if (cleanPath.indexOf('/login') === 0) initialComp = 'Login';
          else if (cleanPath.indexOf('/privacidade') === 0) initialComp = 'PrivacyPolicy';
          else if (cleanPath.indexOf('/site') === 0 || cleanPath.indexOf('/vistage') === 0) initialComp = 'VistageLandingPage';

          var isProdHost = (window.location.hostname || '').indexOf('brfiacrminteligente.goskip.app') !== -1;
          var envLabel = isProdHost ? 'production' : 'preview';
          var syncRouteData = {
            path: initialPath,
            component: initialComp,
            environment: envLabel,
            version: CURRENT_VERSION
          };
          localStorage.setItem('currentRoute', JSON.stringify(syncRouteData));
          localStorage.setItem('route-store', JSON.stringify({ state: { currentRoute: syncRouteData } }));
          // Espelha também no escopo global para acesso direto de scanners sem depender de storage
          window.__currentRoute = syncRouteData;
        } catch (e) {}

        // 1. Ouvir mensagens do kill-switch para recarregar se necessário
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'sw-kill-switch-reload') {
              if (!sessionStorage.getItem('sw_killed_reload_done')) {
                sessionStorage.setItem('sw_killed_reload_done', '1');
                window.location.reload();
              }
            }
          });

          // Registrar /sw.js imediatamente para forçar o navegador a instalar/ativar o kill-switch
          navigator.serviceWorker.register('/sw.js').catch(function() {});

          // Limpeza preventiva síncrona/direta de qualquer registro conhecido
          if (navigator.serviceWorker.getRegistrations) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (var i = 0; i < regs.length; i++) {
                regs[i].unregister();
              }
            }).catch(function() {});
          }
        }

        // 2. Apagar caches de CacheStorage
        if ('caches' in window) {
          caches.keys().then(function(keys) {
            for (var i = 0; i < keys.length; i++) {
              caches.delete(keys[i]);
            }
          }).catch(function() {});
        }
      })();
    </script>
