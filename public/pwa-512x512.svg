<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#25D366" />
      <stop offset="100%" stop-color="#128C7E" />
    </linearGradient>
    <filter id="shadow512" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#075E54" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded rectangle for 512 icon -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad512)" />

  <!-- Subtle inner ambient highlight -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="4" />

  <!-- Content group -->
  <g filter="url(#shadow512)">
    <!-- Roof accent -->
    <path d="M196 160 L256 112 L316 160" fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
    <!-- AI Sparkle at peak of roof -->
    <path d="M256 82 L260 96 L274 100 L260 104 L256 118 L252 104 L238 100 L252 96 Z" fill="#FEF08A" />

    <!-- Main BRF Typography -->
    <text x="256" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="108" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">BRF</text>

    <!-- Subtitle Pill for CRM & IA -->
    <rect x="156" y="324" width="200" height="46" rx="23" fill="#075E54" fill-opacity="0.5" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2" />
    <text x="256" y="356" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">IA CRM</text>

    <!-- Smart connectivity dots -->
    <circle cx="136" cy="272" r="6" fill="#A7F3D0" />
    <circle cx="376" cy="272" r="6" fill="#A7F3D0" />
  </g>
</svg>
