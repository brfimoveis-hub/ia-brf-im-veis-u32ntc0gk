<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#25D366" />
      <stop offset="100%" stop-color="#128C7E" />
    </linearGradient>
    <filter id="shadow192" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#075E54" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded rectangle for standard icon -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad192)" />

  <!-- Inner highlight -->
  <rect x="9" y="9" width="174" height="174" rx="36" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.5" />

  <!-- Content group -->
  <g filter="url(#shadow192)">
    <!-- Roof accent -->
    <path d="M74 60 L96 42 L118 60" fill="none" stroke="#FFFFFF" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- AI Sparkle at peak of roof -->
    <path d="M96 31 L97.5 36.5 L103 38 L97.5 39.5 L96 45 L94.5 39.5 L89 38 L94.5 36.5 Z" fill="#FEF08A" />

    <!-- Main BRF Typography -->
    <text x="96" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="40" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">BRF</text>

    <!-- Subtitle Pill for CRM & IA -->
    <rect x="58" y="122" width="76" height="18" rx="9" fill="#075E54" fill-opacity="0.55" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1" />
    <text x="96" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.2">IA CRM</text>

    <!-- Smart connectivity dots -->
    <circle cx="51" cy="102" r="2.5" fill="#A7F3D0" />
    <circle cx="141" cy="102" r="2.5" fill="#A7F3D0" />
  </g>
</svg>
